          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(s)


          def sub_once(text, pattern, repl, label):
              new, n = re.subn(pattern, repl, text, count=0)
              if n != 1:
                  sys.exit("PATCH ERROR: '%s' matched %d times (expected 1)" % (label, n))
              return new


          def replace_n(text, old, new, label):
              if old not in text:
                  sys.exit("PATCH ERROR: '%s' not found" % label)
              return text.replace(old, new)


          def match_brace(s, open_idx):
              """Index of the '}' that closes the '{' at open_idx (skips strings/comments)."""
              depth, i, n = 0, open_idx, len(s)
              while i < n:
                  c = s[i]
                  if s.startswith("//", i):
                      i = s.index("\n", i)
                      continue
                  if s.startswith("/*", i):
                      i = s.index("*/", i) + 2
                      continue
                  if c == '"' or c == "'":
                      q = c
                      i += 1
                      while s[i] != q:
                          i += 2 if s[i] == "\\" else 1
                      i += 1
                      continue
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              sys.exit("PATCH ERROR: unbalanced braces")


          def remove_about(src):
