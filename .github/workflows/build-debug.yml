              /** Applies the focus-frame on/off + colour settings (also tints the PIN pad). */
              private void applyRingStyle() {
                  if (prefs == null) return;
                  int c = RING_COLORS[ringColorIndex()];
                  PinLock.accent = c;
                  RingView rv = ringView;
                  if (rv != null) rv.setStyle(prefs.getBoolean("ring_on", true), c);
              }

              private int cornerPct() {
                  android.content.SharedPreferences p = prefs != null ? prefs : getSharedPreferences(PREFS, MODE_PRIVATE);
                  int v = p.getInt("corner_pct", 20);
                  if (v < 0) v = 0;
                  if (v > 30) v = 30;
                  return v - (v % 2);
              }

              /** Icon roundness: 0..30 % in steps of 2 (default 20 %). */
              private void stepCorner(int dir, boolean wrap) {
                  int v = cornerPct() + dir * 2;
                  if (v > 30) v = wrap ? 0 : 30;
                  if (v < 0)  v = wrap ? 30 : 0;
                  prefs.edit().putInt("corner_pct", v).apply();
                  applyCornerStyle();
                  refreshSettingsRows();
              }

              private void applyCornerStyle() {
                  computeTileDims();                          // tileCornerPx follows corner_pct
                  LruCache<String, Bitmap> bc = bannerCache;
                  if (bc != null) bc.evictAll();              // banners are baked with the corner
                  bannerInflight.clear();
                  RingView rv = ringView;
                  if (rv != null) rv.setCorner(tileCornerPx);
                  RecyclingShelfView s = shelf;
                  if (s != null) applyShelfApps(s);
              }

              /** PIN screen style: modern (default) <-> classic. */
              private void togglePinStyle() {
                  prefs.edit().putInt("pin_style", PinLock.isModern(prefs) ? 0 : 1).apply();
                  refreshSettingsRows();
              }

              private void stepRingColor(int dir) {
                  int n = RING_COLORS.length;
                  prefs.edit().putInt("ring_color", (ringColorIndex() + dir + n) % n).apply();
                  applyRingStyle();
                  refreshSettingsRows();
              }

              private boolean privacyDirty = false;

              /** Hide / unhide one app from the "Gizleme" list (batched: the shelf is
               *  refreshed once when the list closes, see {@link #finishPrivacyEdit}). */
              private void setAppHiddenFromPrivacy(AppInfo app, boolean hide) {
                  if (app == null) return;
                  if (hide) {
                      int idx = buildVisibleList().indexOf(app);
                      int oldHc = effectiveHomeCount(countVisible(appList));
                      boolean wasHome = idx >= 0 && idx < oldHc;
                      if (!hiddenApps.add(app.packageName)) return;
                      if (wasHome && homeCount > 1) { homeCount--; saveHomeCount(); }
                      saveHiddenApps();
                  } else {
                      if (!hiddenApps.remove(app.packageName)) return;
                      saveHiddenApps();
                      repositionUnhiddenIntoDrawer(app);
                  }
                  privacyDirty = true;
              }

              /** Called when the "Gizleme" list closes: refresh the shelf if needed and
               *  give the settings panel its focus back. */
              private void finishPrivacyEdit() {
                  if (privacyDirty) {
                      privacyDirty = false;
                      keymapHideBuiltSize = -1;
                      keymapHideDirty     = true;
                      RecyclingShelfView s = shelf;
                      if (s != null) applyShelfApps(s);
                  }
                  final FrameLayout ov = settingsOverlay;
                  if (ov != null) {
                      ov.requestFocus();
                      ov.post(() -> {
                          ov.requestFocus();
                          RingView rv = ringView;
                          if (rv != null) rv.setVisibility(View.INVISIBLE);
                      });
                  }
              }

              private static int indexInRows(int[] rows, int id) {
                  for (int i = 0; i < rows.length; i++) if (rows[i] == id) return i;
                  return 0;
              }

