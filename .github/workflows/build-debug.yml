name: Build APK (PIN)

# Manual trigger only: Actions tab -> "Build APK (PIN)" -> Run workflow.
# Builds the small, optimised RELEASE APK (R8 shrink + resource shrink) and
# signs it with a throw-away key that is created once and kept in the Actions
# cache, so later builds install OVER the previous one (PIN/settings survive).
# No secrets needed. The APK is attached to a GitHub Release.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g -XX:MaxMetaspaceSize=512m"
  GRADLE_VERSION: "8.14.5"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Apply the patch to the source
        run: python3 apply_pin_patch.py

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          mkdir -p "$HOME/gradle" && unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: LauncherV15
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew

      - name: Restore signing key (cache)
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/bare-signing
          key: bare-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bare-signing"
          keytool -genkeypair -keystore "$HOME/bare-signing/release.jks" -storetype JKS \
            -storepass barelauncher -keypass barelauncher -alias barekey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BareLauncher"

      - name: Build signed release APK
        working-directory: LauncherV15
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/bare-signing/release.jks" \
            -Pandroid.injected.signing.store.password=barelauncher \
            -Pandroid.injected.signing.key.alias=barekey \
            -Pandroid.injected.signing.key.password=barelauncher \
            -Pandroid.injected.signing.store.type=JKS \
            --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          cp LauncherV15/app/build/outputs/apk/release/app-release.apk BareLauncher-PIN.apk
          ls -l BareLauncher-PIN.apk

      - name: Upload APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BareLauncher-PIN-apk
          path: BareLauncher-PIN.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pin-build-${{ github.run_number }}"
          SIZE=$(du -k BareLauncher-PIN.apk | cut -f1)
          gh release create "$TAG" BareLauncher-PIN.apk \
            --title "BareLauncher + PIN ($TAG)" \
            --notes "Release APK, ${SIZE} KB." \
            --prerelease \
            --target "${{ github.sha }}"
